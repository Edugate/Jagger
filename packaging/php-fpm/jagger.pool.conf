; Jagger PHP-FPM pool.
;
; Install to the distro's pool.d directory for whichever PHP version is
; default (Debian 13 / Ubuntu 26.04 both currently default to PHP 8.4):
;   /etc/php/8.4/fpm/pool.d/jagger.conf
; then: systemctl restart php8.4-fpm
;
; Runs as the dedicated `jagger` system user instead of www-data, so a
; compromised PHP process can't touch other sites' files on a shared host
; and can't write anywhere in /opt/jagger except the paths it actually
; needs (see the listen.owner/group and open_basedir settings below).

[jagger]
user = jagger
group = jagger

listen = /run/php/jagger-fpm.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 4
pm.max_requests = 500

php_admin_value[error_log] = /var/log/jagger/php-fpm-error.log
php_admin_flag[log_errors] = on
php_admin_value[memory_limit] = 256M
php_admin_value[max_execution_time] = 60
php_admin_value[upload_max_filesize] = 8M
php_admin_value[post_max_size] = 8M

; CI3's session library is autoloaded on every request
; (application/config/autoload.php: $autoload['drivers'] = array('session');)
; -- explicitly pointed at a known, jagger-owned directory (created by
; packaging/scripts/provision.sh) instead of depending on whatever
; Debian/Ubuntu's stock php.ini defaults session.save_path to. Getting this
; wrong here (unlike the CLI workers) breaks login/sessions for every real
; user, not just log noise -- open_basedir below must include it or
; PHP can't read/write session files at all.
php_admin_value[session.save_path] = /var/lib/jagger/sessions

; Confines the pool to exactly the paths Jagger needs to read/write.
; /etc/jagger: config lives outside the source tree (docs/AUDIT.md #4),
; read-only access is implicit -- PHP just needs to open() the files.
php_admin_value[open_basedir] = /opt/jagger:/etc/jagger:/var/log/jagger:/var/lib/jagger:/tmp

php_admin_flag[expose_php] = off
